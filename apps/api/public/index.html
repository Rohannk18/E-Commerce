<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CommerceFlow API Status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 32px;
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
    }
    h1 { margin-top: 0; font-size: 24px; display: flex; align-items: center; gap: 8px; color: #a855f7; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .badge { background: #065f46; color: #34d399; font-size: 12px; padding: 4px 10px; border-radius: 9999px; font-weight: 600; display: inline-block; }
    .links { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .link { background: #334155; padding: 10px 14px; border-radius: 10px; color: #e2e8f0; text-decoration: none; font-size: 13px; font-mono: monospace; display: flex; justify-content: space-between; }
    .link:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">● Online & Operational</span>
    <h1>CommerceFlow REST API</h1>
    <p>The backend microservice for CommerceFlow is running. Available API endpoints:</p>
    <div class="links">
      <a href="/api/health" class="link"><span>Health Check</span><span>/api/health</span></a>
      <a href="/api/products" class="link"><span>Product Catalog</span><span>/api/products</span></a>
      <a href="/api/categories" class="link"><span>Categories</span><span>/api/categories</span></a>
    </div>
  </div>
</body>
</html>
